name: Windows checks, installer and release
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - run: node --test scripts/publish-release.test.mjs
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
  publish:
    name: Publish main installer
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the checked commit for release
        run: |
          npm ci
          npm run dist
      - name: Upload, verify and publish installer
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
