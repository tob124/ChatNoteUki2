name: Windows checks and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - run: npm test
      - run: npm run test:desktop
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ChatNoteUki-Windows-x64
          path: release/*Setup-x64.exe
          if-no-files-found: error
